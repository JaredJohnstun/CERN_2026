common_config: &common_settings
  file_pattern: "epoch=(\\d+)-val_loss=([\\d.]+)__(train|val|test)_(.+)\\.h5"
  file_block: "events"
  train_config: "config.yaml"
  meta_data: "metadata.yaml"
  weight_col: "weight"
  label_col: "is_VBF_HH"

  # base bin number, not for plotting, used for trafo
  # SHALL NOT BE OVERWRITTEN
  base_bin_num: 20000

  base_dir: MODEL_DIR_PATH
  fold_dirs:
    fold_0: FOLD_0_NAME
    fold_1: FOLD_1_NAME
    fold_2: FOLD_2_NAME
    fold_3: FOLD_3_NAME
    fold_4: FOLD_4_NAME
  
columns: &columns
  s_ggFHighMass: "{model_name}_pggFHighMassS"
  b_ggFHighMass: "{model_name}_pggFHighMassB"
  vbf_all: "{model_name}_pSVBF"
  ggf_all: "{model_name}_pSGGF"
  ggfBSM_all: "{model_name}_pSGGFBSM"
  b_all: "{model_name}_pB"
  isRun2: "isRun2"
  isRun3: "isRun3"
  class_label: "class_label"
  mHH: "mHH"
  pass_main_stream_trigger: "pass_main_stream_trigger"
  BDT_score: "inclusive_bdt_score"
  isVBFSRBDT: "isVBFSRBDT"
  isDTT: "isDTT"
  isSTT: "isSTT"
  isDBT: "isDBT"
  is_BSM_ggF_HH: "is_BSM_ggF_HH"
  is_ggF_HH: "is_ggF_HH"

input_data:
  - <<: *common_settings
    # override base_dir and fold_dirs if needed
    classifiers:
      "GNN-MulticlassifierHead":
        columns: *columns
        expression: "2 / (1 + (b_all)/(vbf_all)) - 1"
        selection: "(is_BSM_ggF_HH==0) & (is_ggF_HH==0) & (1/(1+vbf_all/ggf_all) <= 0.1) "
        split_train_test_val: True
        score_plot_config:
          train: { "type": "hist", "histtype": "stepfilled", "linewidth": 2, "linestyle": "-" }
          val: { "type": "hist", "histtype": "step", "linewidth": 2, "linestyle": "--" }
          test: { "type": "marker", "marker": "o", "markersize": 10, "linestyle": "None" }
        score_plot_color: "#91CAE8"

      "BDT":
        columns: *columns
        selection: "(is_BSM_ggF_HH==0) & (is_ggF_HH==0) & (isVBFSRBDT>0) "
        expression: "BDT_score"
        split_train_test_val: False
        # split_train_test_val: True
        score_plot_config:
          test: { "type": "hist", "histtype": "stepfilled", "linewidth": 2, "linestyle": "--" }
        score_plot_color: "#F48892"

include_roc: False
include_roc_inverse: True
include_score_distribution: False
include_score_distribution_trafo: True

roc:
  drop_negative_weights: True
  figure_size: [ 10, 8 ]
  # All configs bellow are ONLY for background rejection vs signal efficiency plot
  roc_range: [ 0.1, 1.0 ]
  reference_dataset: 'test' # dataset used for reference in ratio plot
  reference_classifier: "BDT" # classifier used for referece in ratio plot
  reference_fold: 'fold_0' # fold used for reference in ratio plot

score_distribution:
  # !!!! IMPORTANT: Please keep the range of the classifier's score within this range !!!! #
  # !!!!            events with scores outside this range will be ignored             !!!! #
  # !!!!            and not be considered for the evaluation.                         !!!! #
  # !!!!            Please use expression to transform the score to this range.       !!!! #
  x_min: -1
  x_max: 1
  use_test_bin_edges: True

  figure_size: [ 10, 12 ]
  bin_num: 15 # for plotting
  y_log: True
  reference_dataset: 'test' # dataset used for reference in ratio plot
  baseline_classifier: "BDT" # classifier used for baseline in ratio plot
  ratio_pulls: False # using (A-B) / sqrt(sigma_A**2 + sigma_B**2) instead of A / B for ratio plot

  # for fold comparison plot
  fold_colors:
    fold_0: "#F48892"
    fold_1: "#91CAE8"
    fold_2: "#8DAFAB"
  fold_reference: "fold_0"

  category:
    0:
      name: "Background"
      color: "#000080"
      # only for comparison plot with all classifiers
      linestyle: "--"
      linewidth: 3
    1:
      name: "Signal"
      color: "#B22222"
      # only for comparison plot with all classifiers
      linestyle: "-"
      linewidth: 3

  trafo:
    # plot_on: "test" # dataset used for trafo binning (then apply to all other dataset types)
    # use HHARD binning for trafo, otherwise soft binning: https://gitlab.cern.ch/atlas-physics/HDBS/DiHiggs/bbtautau/HHARD/-/blob/master/python/definitions/bbttBinning.py#L6
    use_hhard_binning: True
    trafo_sixty_mc_low_bound: 3.0
    trafo_six_y: 10
    trafo_six_z: 5
    trafo_six_mc_stat_up_bound: 0.2
    # trafo_six_mc_stat_up_bound: 0.3